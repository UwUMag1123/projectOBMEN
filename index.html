<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Обмен навыками</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B1220;--card:#131C2E;--card2:#1A2438;--border:#243049;--border2:#334159;--text:#E8EDF5;--muted:#8B9AB3;--muted2:#5E6C85;--accent:#3B82F6;--accent2:#6366F1;--success:#10B981;--danger:#EF4444;--warn:#F59E0B;--sh:0 6px 24px rgba(0,0,0,.35);--shL:0 18px 48px rgba(0,0,0,.55);--r:14px;--rs:10px;--grad:linear-gradient(135deg,#3B82F6 0%,#6366F1 100%)}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;background-image:radial-gradient(ellipse at top,rgba(59,130,246,.08),transparent 60%),radial-gradient(ellipse at bottom right,rgba(99,102,241,.06),transparent 50%);background-attachment:fixed}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;transition:transform .15s,background .15s,opacity .15s}
button:active{transform:scale(.97)}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
.container{max-width:1140px;margin:0 auto;padding:0 20px;width:100%}
.topbar{position:sticky;top:0;z-index:100;background:rgba(11,18,32,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border)}
.topbar-in{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;flex-shrink:0;letter-spacing:-.02em}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;box-shadow:0 6px 20px rgba(59,130,246,.35)}
.logo-text{white-space:nowrap;background:linear-gradient(135deg,#E8EDF5,#93B4FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav{display:flex;gap:2px;flex:1}
.nav a{padding:8px 14px;border-radius:var(--rs);font-size:14px;font-weight:500;color:var(--muted);transition:.15s}
.nav a:hover{background:rgba(59,130,246,.1);color:var(--text)}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{padding:9px 18px;border-radius:var(--rs);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.32)}
.btn-primary:hover{box-shadow:0 8px 24px rgba(59,130,246,.45);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.08)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:rgba(59,130,246,.1);color:var(--text)}
.btn-block{width:100%}
.btn-lg{padding:14px 24px;font-size:15px}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-google{background:#fff;color:#1f1f1f;font-weight:600;padding:14px 24px;border-radius:var(--rs);width:100%;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:.15s}
.btn-google:hover{box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(-1px)}
.icon-btn{width:38px;height:38px;border-radius:var(--rs);border:1px solid var(--border);display:grid;place-items:center;font-size:16px;position:relative;background:rgba(19,28,46,.6);color:var(--text)}
.icon-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.12)}
.bell-badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;border:2px solid var(--bg)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0;box-shadow:0 4px 12px rgba(59,130,246,.3)}
.avatar-md{width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;flex-shrink:0}
.avatar-lg{width:76px;height:76px;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;margin-bottom:16px;box-shadow:0 10px 30px rgba(59,130,246,.35)}
.main{flex:1;padding:28px 0 60px}
.view{display:none}
.view.active{display:block;animation:fade .35s cubic-bezier(.16,1,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero{padding:56px 0;text-align:center;position:relative;border-radius:24px;margin-bottom:40px;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(59,130,246,.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(99,102,241,.12),transparent 50%),rgba(19,28,46,.5);border:1px solid var(--border)}
.hero h1{font-size:clamp(32px,6vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-bottom:18px;background:linear-gradient(135deg,#E8EDF5 30%,#3B82F6 80%,#6366F1 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:17px;color:var(--muted);max-width:560px;margin:0 auto 32px}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.section{margin-bottom:44px}
.section-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.section-sub{color:var(--muted);font-size:14px;margin-top:2px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.step{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 16px;transition:.2s;position:relative;overflow:hidden}
.step::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:0;transition:.25s}
.step:hover{border-color:var(--border2);transform:translateY(-2px)}
.step:hover::before{opacity:1}
.step-num{font-size:12px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.06em;margin-bottom:10px;display:block}
.step-title{font-size:14px;font-weight:700;margin-bottom:6px}
.step-text{font-size:13px;color:var(--muted);line-height:1.45}
.search-bar{display:flex;gap:10px;margin-bottom:20px}
.search-bar input{flex:1;padding:12px 16px;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);font-size:14px;outline:none;transition:.15s}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.search-bar input::placeholder{color:var(--muted2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{padding:7px 14px;border-radius:100px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(59,130,246,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:.25s;display:flex;flex-direction:column;cursor:pointer;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 16px 40px rgba(59,130,246,.18)}
.card-img{height:130px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:38px;font-weight:800;position:relative;overflow:hidden}
.card-img::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.2),transparent 60%)}
.card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-cat{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.card-title{font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.card-swap{display:flex;flex-direction:column;gap:5px;font-size:13px;padding-top:10px;border-top:1px solid var(--border)}
.swap-row{display:flex;gap:8px;align-items:flex-start}
.swap-lbl{font-weight:700;font-size:12px;min-width:58px;flex-shrink:0}
.swap-lbl.give{color:var(--success)}
.swap-lbl.want{color:var(--muted)}
.swap-text{color:var(--muted);line-height:1.4}
.card-footer{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.card-footer .avatar{width:22px;height:22px;font-size:11px;box-shadow:none}
.empty{padding:56px 24px;background:var(--card);border:1px dashed var(--border2);border-radius:var(--r);text-align:center}
.empty-icon{width:56px;height:56px;border-radius:14px;background:rgba(59,130,246,.12);color:var(--accent);display:grid;place-items:center;font-size:26px;margin:0 auto 16px}
.empty-title{font-size:17px;font-weight:700;margin-bottom:8px}
.empty-text{color:var(--muted);font-size:14px;max-width:400px;margin:0 auto 20px;line-height:1.5}
.form-wrap{max-width:520px;margin:0 auto}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:32px 28px}
.form-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.form-sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--text)}
.field .hint{font-size:11px;color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{padding:11px 14px;border-radius:var(--rs);border:1px solid var(--border);background:rgba(11,18,32,.5);font-size:14px;outline:none;transition:.15s;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.14)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-error{padding:12px 14px;border-radius:var(--rs);background:rgba(239,68,68,.12);color:#FCA5A5;font-size:13px;font-weight:500;display:none;border:1px solid rgba(239,68,68,.25)}
.form-error.show{display:block}
.form-alt{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.form-alt a{color:var(--accent);font-weight:600;cursor:pointer}
.banner{padding:14px 18px;border-radius:var(--r);margin-bottom:20px;display:flex;gap:14px;align-items:center;font-size:14px}
.banner-info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93C5FD}
.dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.dash-title{font-size:26px;font-weight:800;letter-spacing:-.025em;margin-bottom:6px}
.dash-sub{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.stat{padding:18px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--grad)}
.stat-value{font-size:24px;font-weight:800;line-height:1;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:12px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
.tab{padding:12px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px}
.profile-name{font-size:20px;font-weight:800}
.profile-username{color:var(--muted);font-size:14px;margin-top:2px;margin-bottom:18px}
.rating-display{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:16px}
.stars{color:#FBBF24;font-size:16px;letter-spacing:2px}
.pi-row{font-size:14px;line-height:1.5;padding-top:12px;margin-top:12px;border-top:1px solid var(--border)}
.pi-row:first-child{border-top:none;padding-top:0;margin-top:0}
.pi-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.detail{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.detail-hero{height:220px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:56px;font-weight:800;position:relative}
.detail-body{padding:28px 30px 32px}
.detail-cat{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.detail-title{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.2;margin-bottom:18px}
.detail-author{display:flex;align-items:center;gap:12px;padding:14px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px}
.detail-author-info{flex:1}
.detail-author-name{font-weight:700;font-size:15px}
.detail-author-sub{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.detail-swap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.detail-swap-block{padding:16px 18px;border-radius:var(--rs);background:rgba(11,18,32,.5);border:1px solid var(--border)}
.detail-swap-block.want{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.25)}
.detail-swap-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.detail-swap-block.want .detail-swap-lbl{color:#A5B4FC}
.detail-swap-txt{font-size:14px;font-weight:600;line-height:1.4}
.detail-desc{font-size:15px;line-height:1.7;margin-bottom:24px;white-space:pre-wrap;color:#C9D4E8}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap}
.exchange{padding:18px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;transition:.2s}
.exchange:hover{border-color:var(--border2)}
.ex-head{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-start}
.ex-title{font-size:15px;font-weight:700;margin-bottom:4px}
.ex-sub{color:var(--muted);font-size:13px}
.ex-status{padding:5px 12px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.st-pending{background:rgba(245,158,11,.15);color:#FCD34D}
.st-accepted{background:rgba(99,102,241,.15);color:#A5B4FC}
.st-rejected{background:rgba(239,68,68,.15);color:#FCA5A5}
.st-completed{background:rgba(16,185,129,.15);color:#6EE7B7}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:480px}
.chat-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(11,18,32,.4)}
.chat-head-info{flex:1;min-width:0}
.chat-head-title{font-weight:700;font-size:15px}
.chat-head-sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:rgba(11,18,32,.35)}
.msg{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45;word-wrap:break-word;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg-in{background:var(--card2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg-out{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg-time{font-size:10px;opacity:.7;margin-top:4px;display:block}
.chat-input{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--card)}
.chat-input input{flex:1;padding:11px 14px;border-radius:var(--rs);border:1px solid var(--border);background:rgba(11,18,32,.5);font-size:14px;outline:none;transition:.15s}
.chat-input input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.chat-locked{padding:16px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:13px;background:rgba(11,18,32,.4)}
.video-zone{padding:16px 20px;border-top:1px solid var(--border);background:rgba(11,18,32,.4);display:flex;flex-direction:column;gap:12px}
.video-zone-head{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.video-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.video-slot{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);text-align:center;font-size:13px;transition:.15s}
.video-slot.done{border-color:var(--success);background:rgba(16,185,129,.08)}
.video-slot.done .video-slot-status{color:#6EE7B7;font-weight:700}
.video-slot.wait .video-slot-status{color:var(--muted)}
.video-slot-label{font-weight:700;margin-bottom:4px;font-size:12px}
.video-slot-status{font-size:12px}
.video-upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file-label{padding:10px 18px;border-radius:var(--rs);border:1px dashed var(--border2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;color:var(--text)}
.file-label:hover{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.08)}
.video-upload input[type=file]{display:none}
.notifications-list{display:flex;flex-direction:column;gap:10px}
.notif{padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);display:flex;gap:14px;align-items:flex-start;transition:.15s}
.notif.unread{border-color:var(--accent);background:rgba(59,130,246,.06)}
.notif-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:rgba(59,130,246,.12);color:var(--accent)}
.notif-icon.exchange_request{background:rgba(245,158,11,.15);color:#FCD34D}
.notif-icon.exchange_accepted{background:rgba(16,185,129,.15);color:#6EE7B7}
.notif-icon.exchange_rejected{background:rgba(239,68,68,.12);color:#FCA5A5}
.notif-icon.exchange_completed{background:rgba(99,102,241,.15);color:#A5B4FC}
.notif-body{flex:1;min-width:0}
.notif-text{font-size:14px;line-height:1.45;margin-bottom:6px}
.notif-meta{font-size:12px;color:var(--muted)}
.notif-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);color:var(--text);padding:13px 22px;border-radius:100px;font-size:14px;font-weight:600;box-shadow:var(--shL);z-index:999;opacity:0;transition:.35s cubic-bezier(.16,1,.3,1);pointer-events:none;max-width:90vw;text-align:center;border:1px solid var(--border2)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(5,9,17,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fade .2s}
.modal.show{display:flex}
.modal-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:28px;max-width:480px;width:100%;box-shadow:var(--shL)}
.modal-title{font-size:20px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.5}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.rating-input{display:flex;gap:6px;margin:8px 0;font-size:28px;justify-content:center}
.rating-input .star{cursor:pointer;color:var(--muted2);transition:.15s;background:none;border:none;font-size:28px;padding:2px}
.rating-input .star.active{color:#FBBF24;transform:scale(1.1)}
.review{padding:16px;background:rgba(11,18,32,.4);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:10px}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;flex-wrap:wrap}
.review-author{font-weight:700;font-size:14px}
.review-date{color:var(--muted);font-size:12px}
.review-text{font-size:14px;color:#C9D4E8;line-height:1.55}
.review-stars{color:#FBBF24;font-size:14px;letter-spacing:2px}
.footer{padding:26px 0;border-top:1px solid var(--border);color:var(--muted);font-size:12px;background:rgba(19,28,46,.4);margin-top:auto}
.footer-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.loading{padding:48px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pwa-prompt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border2);padding:14px 18px;border-radius:var(--r);box-shadow:var(--shL);z-index:998;display:none;gap:12px;align-items:center;max-width:92vw;font-size:13px}
.pwa-prompt.show{display:flex}
.pwa-prompt button{padding:8px 14px;border-radius:var(--rs);font-size:13px;font-weight:600}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted2)}
@media(max-width:1000px){.steps{grid-template-columns:repeat(2,1fr)}.nav{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.container{padding:0 16px}.topbar-in{height:56px;gap:10px}.logo-text{display:none}.main{padding:20px 0 40px}.hero{padding:36px 20px;margin-bottom:28px}.steps{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.form-card{padding:24px 20px}.field-row{grid-template-columns:1fr}.detail-body{padding:22px 20px 26px}.detail-hero{height:160px}.detail-swap{grid-template-columns:1fr}.chat{height:calc(100vh - 140px);min-height:400px}.video-slots{grid-template-columns:1fr}.actions .btn span.btn-label{display:none}.actions .btn{padding:9px 12px}.dash-title{font-size:22px}.section-title{font-size:19px}.hero h1{font-size:32px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="container topbar-in">
    <a href="#/" class="logo"><span class="logo-mark">⇄</span><span class="logo-text">Обмен навыками</span></a>
    <nav class="nav">
      <a href="#/">Главная</a>
      <a href="#/listings">Объявления</a>
      <a href="#/exchanges">Обмены</a>
      <a href="#/chats">Чаты</a>
    </nav>
    <div class="actions" id="headerActions"></div>
  </div>
</header>
<main class="container main" id="app"></main>
<footer class="footer">
  <div class="container footer-in">
    <div>© 2026 Обмен навыками</div>
    <div>Сделано для обмена знаниями</div>
  </div>
</footer>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="pwa-prompt" id="pwaPrompt">
  <span>Установить как приложение?</span>
  <button class="btn-primary" id="pwaInstall">Установить</button>
  <button class="btn-ghost" id="pwaDismiss">✕</button>
</div>

<script type="module">
import * as DB from './db.js';

const $=s=>document.querySelector(s);
const app=$('#app');
const CATS=['Музыка','Программирование','Языки','Спорт','Дизайн','Кулинария','Учёба','Другое'];
const state={user:null,listings:[],exchanges:[],notifs:[],allUsers:[],reviews:[],unsubs:{},pendingProfile:null,userRating:{avg:0,count:0}};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(t){return new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function fmtDate(t){return new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function plural(n,f){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return n+' '+f[2];if(b>1&&b<5)return n+' '+f[1];if(b===1)return n+' '+f[0];return n+' '+f[2]}
function starsHtml(r){const n=Math.round(r);return '★'.repeat(n)+'☆'.repeat(5-n)}

let toastTimer;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function openModal(h){$('#modalCard').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function findUser(id){return state.allUsers.find(u=>u.id===id)}

function renderHeader(){
  const el=$('#headerActions');
  let h='';
  if(state.user){
    const initial=(state.user.firstName||state.user.username||'?')[0].toUpperCase();
    const unread=state.notifs.filter(n=>!n.read).length;
    const badge=unread>0?`<span class="bell-badge">${unread>9?'9+':unread}</span>`:'';
    h+=`<button class="icon-btn" onclick="location.hash='#/notifications'" title="Уведомления">🔔${badge}</button>
      <a href="#/create" class="btn btn-primary btn-sm"><span>+</span><span class="btn-label">Разместить</span></a>
      <a href="#/cabinet" class="btn btn-ghost btn-sm" title="Кабинет"><span class="avatar">${esc(initial)}</span></a>
      <button class="btn btn-ghost btn-sm" onclick="window.__logout()">Выйти</button>`;
  }else{
    h+=`<a href="#/login" class="btn btn-ghost">Войти</a>`;
  }
  el.innerHTML=h;
}

function emptyBlock(icon,title,text,link,btn){
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${esc(title)}</div><div class="empty-text">${esc(text)}</div>${link?`<a href="${link}" class="btn btn-primary">${esc(btn)}</a>`:''}</div>`;
}

function cardHTML(l){
  const u=findUser(l.authorId);
  if(!u)return '';
  const initial=(u.firstName||u.username)[0].toUpperCase();
  return `<article class="card" onclick="location.hash='#/listing/${l.id}'">
    <div class="card-img">${esc(l.title[0].toUpperCase())}</div>
    <div class="card-body">
      <div class="card-cat">${esc(l.category)}</div>
      <div class="card-title">${esc(l.title)}</div>
      <div class="card-swap">
        <div class="swap-row"><span class="swap-lbl give">Даю:</span><span class="swap-text">${esc(l.offer)}</span></div>
        <div class="swap-row"><span class="swap-lbl want">Хочу:</span><span class="swap-text">${esc(l.want)}</span></div>
      </div>
      <div class="card-footer"><span class="avatar">${esc(initial)}</span><span>${esc(u.firstName+' '+u.lastName)}</span></div>
    </div></article>`;
}

function screenHome(){
  app.innerHTML=`<div class="view active">
    <div class="hero">
      <h1>Твои знания — твоя валюта</h1>
      <p>Учи тому, что умеешь. Учись тому, что хочешь. Без денег.</p>
      <div class="hero-actions">
        <a href="#/login" class="btn btn-primary btn-lg">Войти через Google</a>
        <a href="#/listings" class="btn btn-outline btn-lg">Смотреть объявления</a>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><div><div class="section-title">Как это работает</div><div class="section-sub">Пять шагов от входа до обмена</div></div></div>
      <div class="steps">
        <div class="step"><span class="step-num">01</span><div class="step-title">Вход</div><div class="step-text">Один клик через Google</div></div>
        <div class="step"><span class="step-num">02</span><div class="step-title">Объявление</div><div class="step-text">Опишите, что даёте и что хотите</div></div>
        <div class="step"><span class="step-num">03</span><div class="step-title">Запрос</div><div class="step-text">Отправьте заявку автору</div></div>
        <div class="step"><span class="step-num">04</span><div class="step-title">Чат</div><div class="step-text">После принятия открывается чат</div></div>
        <div class="step"><span class="step-num">05</span><div class="step-title">Обмен</div><div class="step-text">Обменяйтесь видео и получите Тайм-коин</div></div>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><div><div class="section-title">Свежие объявления</div><div class="section-sub">Предложения пользователей</div></div><a href="#/listings" class="btn btn-outline btn-sm">Смотреть все</a></div>
      <div id="homeListings"><div class="loading"><div class="spinner"></div>Загрузка…</div></div>
    </div>
  </div>`;
  const items=state.listings.slice(0,3);
  const el=$('#homeListings');
  if(el)el.innerHTML=items.length?'<div class="grid">'+items.map(cardHTML).join('')+'</div>'
    :emptyBlock('⇄','Объявлений пока нет','Станьте первым, кто разместит предложение.','#/create','Разместить');
}

function screenListings(){
  app.innerHTML=`<div class="view active">
    <div class="section-head"><div><div class="section-title">Все объявления</div><div class="section-sub" id="listingsCount">Загрузка…</div></div></div>
    <div class="search-bar"><input type="text" id="searchInput" placeholder="Поиск по названию, описанию, навыку…"></div>
    <div class="filters" id="filters">
      <button class="chip active" data-cat="all" onclick="window.__filterCat('all',this)">Все</button>
      ${CATS.map(c=>`<button class="chip" data-cat="${esc(c)}" onclick="window.__filterCat('${esc(c)}',this)">${esc(c)}</button>`).join('')}
    </div>
    <div id="listingsWrap"></div>
  </div>`;
  const inp=$('#searchInput');
  if(inp){
    inp.value=state.searchQuery||'';
    inp.addEventListener('input',()=>{state.searchQuery=inp.value;loadListings()});
  }
  loadListings();
}
function loadListings(){
  const cat=state.filterCat||'all';
  const q=(state.searchQuery||'').trim().toLowerCase();
  let items=state.listings.slice();
  if(cat!=='all')items=items.filter(l=>l.category===cat);
  if(q)items=items.filter(l=>(l.title+' '+l.offer+' '+l.want+' '+l.description).toLowerCase().includes(q));
  const cnt=$('#listingsCount');
  if(cnt)cnt.textContent=items.length?plural(items.length,['предложение','предложения','предложений']):'Пока нет предложений';
  const wrap=$('#listingsWrap');
  if(wrap)wrap.innerHTML=items.length?'<div class="grid">'+items.map(cardHTML).join('')+'</div>'
    :emptyBlock('🔍','Ничего не найдено','Попробуйте изменить запрос или категорию.','#/create','Разместить');
}

function screenListing(id){
  const l=state.listings.find(x=>x.id===id);
  if(!l){app.innerHTML=`<div class="view active">${emptyBlock('×','Объявление не найдено','Оно было удалено.','#/listings','К списку')}</div>`;return}
  const u=findUser(l.authorId);
  if(!u){app.innerHTML=`<div class="view active">${emptyBlock('×','Автор не найден','Аккаунт удалён.','#/listings','К списку')}</div>`;return}
  const initial=(u.firstName||u.username)[0].toUpperCase();
  const isMine=state.user&&state.user.id===u.id;
  app.innerHTML=`<div class="view active">
    <a href="#/listings" class="btn btn-ghost btn-sm" style="margin-bottom:16px">← К объявлениям</a>
    <div class="detail">
      <div class="detail-hero">${esc(l.title[0].toUpperCase())}</div>
      <div class="detail-body">
        <div class="detail-cat">${esc(l.category)}</div>
        <h1 class="detail-title">${esc(l.title)}</h1>
        <div class="detail-author">
          <span class="avatar-md">${esc(initial)}</span>
          <div class="detail-author-info">
            <div class="detail-author-name">${esc(u.firstName+' '+u.lastName)}</div>
            <div class="detail-author-sub">@${esc(u.username)} <span class="stars">${starsHtml(u.rating?.avg||0)}</span></div>
          </div>
        </div>
        <div class="detail-swap">
          <div class="detail-swap-block"><div class="detail-swap-lbl">Даю</div><div class="detail-swap-txt">${esc(l.offer)}</div></div>
          <div class="detail-swap-block want"><div class="detail-swap-lbl">Хочу взамен</div><div class="detail-swap-txt">${esc(l.want)}</div></div>
        </div>
        <div class="detail-desc">${esc(l.description)}</div>
        <div class="detail-actions">
          ${isMine?'<button class="btn btn-outline btn-lg" disabled>Это ваше объявление</button>'
            :`<button class="btn btn-primary btn-lg" onclick="window.__openExchange('${l.id}')">Хочу обменяться</button>`}
          <a href="#/listings" class="btn btn-outline btn-lg">Вернуться</a>
          ${!isMine?`<button class="btn btn-ghost btn-sm" onclick="window.__openReport('${l.id}')">⚠ Пожаловаться</button>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

function openExchange(lid){
  if(!state.user){toast('Войдите, чтобы отправить запрос');location.hash='#/login';return}
  openModal(`<div class="modal-title">Запрос на обмен</div>
    <div class="modal-sub">Автор получит уведомление и сможет принять или отклонить запрос.</div>
    <div class="field"><label>Сообщение <span class="hint">— по желанию</span></label>
      <textarea id="exchangeMsg" rows="3" placeholder="Расскажите, почему вам интересен обмен"></textarea></div>
    <div class="form-error" id="exchangeErr"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="window.__closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="window.__sendExchange('${lid}')">Отправить</button>
    </div>`);
}

async function sendExchange(lid){
  const err=$('#exchangeErr');
  const msg=$('#exchangeMsg').value.trim();
  try{
    const l=state.listings.find(x=>x.id===lid);
    if(!l)throw new Error('Объявление не найдено');
    const existing=await DB.checkExistingExchange(lid,state.user.id);
    if(existing){err.textContent='Запрос уже отправлен';err.classList.add('show');return}
    await DB.createExchange(lid,state.user.id,l.authorId,msg);
    closeModal();toast('Запрос отправлен');location.hash='#/exchanges';
  }catch(e){err.textContent=e.message;err.classList.add('show')}
}

function openReport(lid){
  openModal(`<div class="modal-title">Пожаловаться на объявление</div>
    <div class="modal-sub">Опишите проблему. Мы рассмотрим жалобу в течение 24 часов.</div>
    <div class="field"><label>Причина</label>
      <textarea id="reportReason" rows="4" placeholder="Например: спам, оскорбления, запрещённый контент"></textarea></div>
    <div class="form-error" id="reportErr"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="window.__closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="window.__sendReport('${lid}')">Отправить</button>
    </div>`);
}
async function sendReport(lid){
  const err=$('#reportErr');
  const reason=$('#reportReason').value.trim();
  if(reason.length<5){err.textContent='Опишите проблему подробнее';err.classList.add('show');return}
  try{await DB.createReport(state.user.id,lid,reason);closeModal();toast('Жалоба отправлена')}
  catch(e){err.textContent=e.message;err.classList.add('show')}
}

function screenLogin(){
  app.innerHTML=`<div class="view active"><div class="form-wrap"><div class="form-card">
    <div class="form-title" style="text-align:center">Вход в аккаунт</div>
    <div class="form-sub" style="text-align:center">Используйте свой Google-аккаунт. Это быстро и безопасно.</div>
    <button class="btn-google" onclick="window.__googleLogin()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Войти через Google
    </button>
    <div class="form-error" id="loginError" style="margin-top:16px"></div>
    <div class="form-alt" style="margin-top:20px;font-size:12px">Продолжая, вы соглашаетесь с правилами сервиса</div>
  </div></div></div>`;
}

function screenCompleteProfile(){
  const p=state.pendingProfile;
  if(!p)return location.hash='#/';
  app.innerHTML=`<div class="view active"><div class="form-wrap"><div class="form-card">
    <div class="form-title">Заполните профиль</div>
    <div class="form-sub">Это займёт минуту. Укажите логин и свои навыки.</div>
    <form class="form" onsubmit="window.__doComplete(event)">
      <div class="form-error" id="cpError"></div>
      <div class="banner banner-info">📧 Вы вошли как <b>${esc(p.email||'')}</b></div>
      <div class="field"><label>Логин <span class="hint">— латиница, 3-20 символов</span></label><input type="text" id="cpUsername" placeholder="ivan_petrov" autofocus></div>
      <div class="field-row">
        <div class="field"><label>Имя</label><input type="text" id="cpFirstName" value="${esc(p.firstName||'')}"></div>
        <div class="field"><label>Фамилия</label><input type="text" id="cpLastName" value="${esc(p.lastName||'')}"></div>
      </div>
      <div class="field"><label>Чему могу научить</label><textarea id="cpCanTeach" rows="2" placeholder="Например: игра на гитаре, Python"></textarea></div>
      <div class="field"><label>Чему хочу научиться</label><textarea id="cpWantsLearn" rows="2" placeholder="Например: рисование, шахматы"></textarea></div>
      <div class="field"><label>О себе <span class="hint">— по желанию</span></label><textarea id="cpBio" rows="2" placeholder="Коротко о вас"></textarea></div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Готово</button>
    </form>
  </div></div></div>`;
}
async function doComplete(e){
  e.preventDefault();
  const err=$('#cpError');
  const un=$('#cpUsername').value.trim();
  const fn=$('#cpFirstName').value.trim();
  const ln=$('#cpLastName').value.trim();
  const ct=$('#cpCanTeach').value.trim();
  const wl=$('#cpWantsLearn').value.trim();
  const bio=$('#cpBio').value.trim();
  if(!/^[a-z0-9_]{3,20}$/i.test(un)){err.textContent='Логин: 3-20 символов, латиница, цифры, _';err.classList.add('show');return}
  if(!fn||!ln){err.textContent='Укажите имя и фамилию';err.classList.add('show');return}
  if(!ct||!wl){err.textContent='Заполните навыки';err.classList.add('show');return}
  try{
    const user=await DB.completeProfile(state.pendingProfile.uid,{
      username:un,firstName:fn,lastName:ln,canTeach:ct,wantsLearn:wl,bio,
      email:state.pendingProfile.email
    });
    state.user=user;
    state.pendingProfile=null;
    renderHeader();
    toast('Профиль готов!');
    location.hash='#/cabinet';
  }catch(ex){err.textContent=ex.message;err.classList.add('show')}
}

function screenCabinet(){
  if(!state.user)return location.hash='#/login';
  const u=state.user;
  const mine=state.listings.filter(l=>l.authorId===u.id);
  const exCount=state.exchanges.filter(x=>x.status==='accepted').length;
  const doneCount=state.exchanges.filter(x=>x.status==='completed').length;
  const initial=(u.firstName||u.username||'?')[0].toUpperCase();
  const rating=u.rating||{avg:0,count:0};
  app.innerHTML=`<div class="view active">
    <div class="dash-head">
      <div><div class="dash-title">Личный кабинет</div><div class="dash-sub">Добро пожаловать, ${esc(u.firstName||u.username)}</div></div>
      <a href="#/create" class="btn btn-primary">+ Новое объявление</a>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-value">${mine.length}</div><div class="stat-label">Объявлений</div></div>
      <div class="stat"><div class="stat-value">${exCount}</div><div class="stat-label">Активных обменов</div></div>

function exCard(ex){
  const isOwner=state.user.id===ex.ownerId;
  const other=findUser(isOwner?ex.initiatorId:ex.ownerId);
  const otherName=other?(other.firstName+' '+other.lastName):'—';
  const l=state.listings.find(x=>x.id===ex.listingId);
  const stMap={pending:'Ожидает',accepted:'Активен',rejected:'Отклонён',completed:'Завершён'};
  const roleLabel=isOwner?'Входящий':'Исходящий';
  let actions='';
  if(ex.status==='pending'&&isOwner){
    actions=`<div class="ex-actions">
      <button class="btn btn-primary" onclick="window.__acceptEx('${ex.id}')">Принять</button>
      <button class="btn btn-outline" onclick="window.__rejectEx('${ex.id}')">Отклонить</button></div>`;
  }else if(ex.status==='pending'&&!isOwner){
    actions='<div class="ex-actions"><span style="color:var(--muted);font-size:13px">Ожидает ответа автора</span></div>';
  }else if(ex.status==='accepted'){
    actions=`<div class="ex-actions"><a href="#/chat/${ex.id}" class="btn btn-primary">Открыть чат</a></div>`;
  }else if(ex.status==='completed'){
    const myReview=isOwner?ex.ownerReview:ex.initiatorReview;
    actions=`<div class="ex-actions">
      <a href="#/chat/${ex.id}" class="btn btn-ghost">История чата</a>

  }
  return `<div class="exchange">

      <div style="flex:1;min-width:200px">
        <div class="ex-title">${esc(l?l.title:'Объявление удалено')}</div>

  return `<div class="notif ${n.read?'':'unread'}">

  const otherId=ex.initiatorId===state.user.id?ex.ownerId:ex.initiatorId;
  const other=findUser(otherId);
  const otherName=other?(other.firstName+' '+(other.lastName||'')):'Пользователь';
  const otherInitial=otherName[0].toUpperCase();
  const l=state.listings.find(x=>x.id===ex.listingId);
  const listTitle=l?l.title:'Обмен';

  const isCompleted=ex.status==='completed';
  const myUploaded=ex.initiatorId===state.user.id?!!ex.initiatorVideo:!!ex.ownerVideo;
  const otherUploaded=ex.initiatorId===state.user.id?!!ex.ownerVideo:!!ex.initiatorVideo;

  app.innerHTML=`<div class="view active">
    <a href="#/chats" class="btn btn-ghost btn-sm" style="margin-bottom:12px">← К чатам</a>

      <div class="chat-head">

        <div class="chat-head-info">
          <div class="chat-head-title">${esc(otherName)}</div>
          <div class="chat-head-sub">${esc(listTitle)}</div>
        </div>
      </div>
      <div class="chat-body" id="chatBody"><div class="loading"><div class="spinner"></div></div></div>
      ${locked?'<div class="chat-locked">Чат откроется после принятия запроса</div>'
        :`<form class="chat-input" onsubmit="window.__sendMsg(event,'${ex.id}')">
            <input type="text" id="chatInput" placeholder="Написать сообщение…" autocomplete="off" maxlength="1000">
            <button type="submit" class="btn btn-primary">→</button>
          </form>`}
      ${!locked?`<div class="video-zone">
        <div class="video-zone-head">Видеоуроки для завершения обмена</div>
        <div class="video-slots">
          <div class="video-slot ${myUploaded?'done':'wait'}">
            <div class="video-slot-label">Ваш урок</div>
            <div class="video-slot-status">${myUploaded?'Загружен ✓':'Не загружен'}</div>
          </div>
          <div class="video-slot ${otherUploaded?'done':'wait'}">
            <div class="video-slot-label">Урок партнёра</div>
            <div class="video-slot-status">${otherUploaded?'Загружен ✓':'Ожидается'}</div>
          </div>
        </div>
        ${isCompleted?'<div style="text-align:center;color:var(--success);font-weight:700;font-size:13px">Обмен завершён. Начислен Тайм-коин.</div>'
          :(myUploaded?'<div style="text-align:center;color:var(--muted);font-size:13px">Ожидаем видео от партнёра</div>'
            :`<div class="video-upload">
                <label class="file-label" for="videoFile">📹 Прикрепить видеоурок (до 500 КБ)</label>
                <input type="file" id="videoFile" accept="video/*" onchange="window.__uploadVideo('${ex.id}',this)">
                <span id="videoFileName" style="font-size:13px;color:var(--muted)"></span>
              </div>`)}
      </div>`:''}
    </div>

  state.unsubs.messages=DB.watchMessages(ex.id,msgs=>{
    const body=$('#chatBody');

    const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<80;
    body.innerHTML=msgs.length

    if(atBottom)body.scrollTop=body.scrollHeight;

  const file=input.files[0];

  const nameEl=$('#videoFileName');

  try{

    else toast('Видеоурок загружен. Ожидаем партнёра.');
    const fresh=await DB.getUser(state.user.id);
    if(fresh)state.user={...fresh,rating:state.user.rating};
  }catch(e){toast(e.message)}
}

async function route(){
  if(state.unsubs.messages){state.unsubs.messages();state.unsubs.messages=null}
  const hash=location.hash.replace(/^#/,'')||'/';
  const parts=hash.split('/').filter(Boolean);
  if(!parts.length)return screenHome();
  if(parts[0]==='listings')return screenListings();
  if(parts[0]==='listing'&&parts[1])return screenListing(parts[1]);
  if(parts[0]==='login')return screenLogin();
  if(parts[0]==='complete-profile')return screenCompleteProfile();
  if(parts[0]==='cabinet')return screenCabinet();
  if(parts[0]==='create')return screenCreate();
  if(parts[0]==='exchanges')return screenExchanges();
  if(parts[0]==='chats')return screenChats();
  if(parts[0]==='chat'&&parts[1])return screenChat(parts[1]);
  if(parts[0]==='notifications')return screenNotifications();
  if(parts[0]==='user'&&parts[1])return screenUser(parts[1]);
  return screenHome();
}

window.__openReview=openReview;
window.__setRating=setRating;
window.__sendReview=sendReview;
window.__sendMsg=sendMsg;
window.__uploadVideo=uploadVideo;
window.__googleLogin=async()=>{
  const err=$('#loginError');
  try{
    const r=await DB.loginWithGoogle();
    if(!r)return;
    state.user=r.user;
    if(r.needsProfile){
      state.pendingProfile=r.user;
      location.hash='#/complete-profile';
    }else{
      renderHeader();
      toast('Вы вошли');
      location.hash='#/cabinet';
    }
  }catch(e){
    let m=e.message||'Ошибка входа';
    if(m.includes('auth/popup'))m='Всплывающее окно заблокировано';
    if(m.includes('auth/unauthorized-domain'))m='Домен не авторизован в Firebase';
    if(err){err.textContent=m;err.classList.add('show')}else toast(m);
  }
};

window.addEventListener('hashchange',()=>{route()});

window.addEventListener('DOMContentLoaded',async()=>{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();deferredPrompt=e;
    $('#pwaPrompt').classList.add('show');
  });
  const pi=$('#pwaInstall');const pd=$('#pwaDismiss');
  if(pi)pi.addEventListener('click',async()=>{
    if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}
    $('#pwaPrompt').classList.remove('show');
  });
  if(pd)pd.addEventListener('click',()=>$('#pwaPrompt').classList.remove('show'));

  try{
    const redirectResult=await DB.checkRedirect();
    if(redirectResult){
      state.user=redirectResult.user;
      if(redirectResult.needsProfile){
        state.pendingProfile=redirectResult.user;
        location.hash='#/complete-profile';
      }
    }
  }catch(e){}

  DB.onAuthChange(async user=>{
    if(user){
      state.user=user;
      try{
        const rating=await new Promise(res=>DB.watchUserRating(user.id,r=>res(r)));
        user.rating=rating;
        state.user=user;
      }catch(e){}
      if(state.unsubs.exchanges)state.unsubs.exchanges();
      if(state.unsubs.notifs)state.unsubs.notifs();
      state.unsubs.exchanges=DB.watchExchanges(user.id,list=>{state.exchanges=list;route()});
      state.unsubs.notifs=DB.watchNotifications(user.id,list=>{state.notifs=list;renderHeader()});
    }else{
      if(state.unsubs.exchanges){state.unsubs.exchanges();state.unsubs.exchanges=null}
      if(state.unsubs.notifs){state.unsubs.notifs();state.unsubs.notifs=null}
      state.exchanges=[];state.notifs=[];
    }
    renderHeader();
    route();
  });

  DB.watchListings(list=>{state.listings=list;route()});

  const refreshUsers=async()=>{
    try{
      const users=await DB.getAllUsers();
      await Promise.all(users.map(async u=>{
        try{u.rating=await new Promise(res=>DB.watchUserRating(u.id,r=>res(r)))}
        catch(e){u.rating={avg:0,count:0}}
      }));
      state.allUsers=users;
    }catch(e){}
  };
  await refreshUsers();
  setInterval(refreshUsers,45000);

  route();
});
</script>
</body>
</html>
