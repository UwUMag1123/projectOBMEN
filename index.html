<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Обмен навыками — сервис взаимного обучения</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F6F7F9;--card:#fff;--text:#0F172A;--muted:#64748B;--border:#E5E9EF;--border2:#CBD5E1;--blue:#1E3A8A;--violet:#7C3AED;--orange:#F97316;--green:#16A34A;--red:#DC2626;--sh:0 4px 16px rgba(15,23,42,.06);--shL:0 16px 40px rgba(15,23,42,.12);--r:12px;--rs:10px}
[data-theme=dark]{--bg:#0D1016;--card:#161A21;--text:#F1F5F9;--muted:#8B95A7;--border:#242A34;--border2:#333B48;--blue:#7DA5FF;--violet:#A78BFA;--orange:#FB923C;--sh:0 4px 16px rgba(0,0,0,.35);--shL:0 16px 40px rgba(0,0,0,.55)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;min-height:100vh;display:flex;flex-direction:column;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}
.container{max-width:1140px;margin:0 auto;padding:0 22px;width:100%}
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border)}
.topbar-in{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;flex-shrink:0}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800}
.logo-text{white-space:nowrap}
.nav{display:flex;gap:2px;flex:1}
.nav a{padding:8px 12px;border-radius:var(--rs);font-size:14px;font-weight:500;color:var(--muted);transition:.15s}
.nav a:hover{background:rgba(30,58,138,.06);color:var(--text)}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{padding:9px 16px;border-radius:var(--rs);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:#EA6A0A}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border2)}
.btn-outline:hover{border-color:var(--orange);color:var(--orange)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:rgba(30,58,138,.06);color:var(--text)}
.btn-block{width:100%}
.btn-lg{padding:12px 22px;font-size:15px}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.theme-btn{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--border);display:grid;place-items:center;font-size:15px;transition:.15s}
.theme-btn:hover{border-color:var(--violet);background:rgba(124,58,237,.06)}
.bell{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--border);display:grid;place-items:center;font-size:16px;position:relative;background:transparent;transition:.15s}
.bell:hover{border-color:var(--orange);background:rgba(249,115,22,.08)}
.bell-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;border:2px solid var(--card)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.avatar-md{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;flex-shrink:0}
.avatar-lg{width:68px;height:68px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;margin-bottom:14px}
.main{flex:1;padding:32px 0 56px}
.view{display:none}
.view.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hero{padding:44px 0 48px;text-align:center;background:linear-gradient(135deg,#EEF2FF 0%,#F5F3FF 55%,#FFF7ED 100%);border-radius:20px;margin-bottom:36px}
[data-theme=dark] .hero{background:linear-gradient(135deg,#0F1626 0%,#1A1230 55%,#2A1810 100%)}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.08;color:var(--blue);margin-bottom:16px}
.hero h1 .g{background:linear-gradient(135deg,var(--violet),var(--orange));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:16px;color:var(--muted);max-width:560px;margin:0 auto 28px}
.hero-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.section{margin-bottom:44px}
.section-head{margin-bottom:22px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.section-sub{color:var(--muted);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.step{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 16px}
.step-num{font-size:12px;font-weight:800;color:var(--orange);letter-spacing:.06em;margin-bottom:10px;display:block}
.step-title{font-size:14px;font-weight:700;margin-bottom:6px}
.step-text{font-size:13px;color:var(--muted);line-height:1.45}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:7px 14px;border-radius:100px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--violet);color:var(--violet)}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:.2s;display:flex;flex-direction:column;cursor:pointer}
.card:hover{border-color:var(--violet);box-shadow:var(--sh);transform:translateY(-2px)}
.card-img{height:140px;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;color:#fff;font-size:38px;font-weight:800}
.card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-cat{font-size:11px;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:.05em}
.card-title{font-size:15px;font-weight:700;line-height:1.3}
.card-swap{display:flex;flex-direction:column;gap:5px;font-size:13px;padding-top:10px;border-top:1px solid var(--border)}
.swap-row{display:flex;gap:8px;align-items:flex-start}
.swap-lbl{font-weight:700;font-size:12px;min-width:58px;flex-shrink:0}
.swap-lbl.give{color:var(--green)}
.swap-lbl.want{color:var(--muted)}
.swap-text{color:var(--muted);line-height:1.4}
.card-footer{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.card-footer .avatar{width:22px;height:22px;font-size:11px}
.empty{padding:44px 24px;background:var(--card);border:1px dashed var(--border2);border-radius:var(--r);text-align:center}
.empty-icon{width:52px;height:52px;border-radius:12px;background:rgba(124,58,237,.1);color:var(--violet);display:grid;place-items:center;font-size:24px;margin:0 auto 14px}
.empty-title{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-text{color:var(--muted);font-size:14px;max-width:400px;margin:0 auto 18px;line-height:1.5}
.form-wrap{max-width:520px;margin:0 auto}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:30px 28px}
.form-title{font-size:20px;font-weight:800;letter-spacing:-.015em;margin-bottom:4px}
.form-sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:11px;color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{padding:10px 13px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--card);color:var(--text);font-size:14px;outline:none;transition:.15s;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-error{padding:11px 13px;border-radius:var(--rs);background:rgba(220,38,38,.08);color:var(--red);font-size:13px;font-weight:500;display:none}
.form-error.show{display:block}
.form-alt{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.form-alt a{color:var(--violet);font-weight:600;cursor:pointer}
.form-alt a:hover{text-decoration:underline}
.dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.dash-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.dash-sub{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat{padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.stat-value{font-size:22px;font-weight:800;color:var(--violet);line-height:1;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{padding:11px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--violet);border-bottom-color:var(--violet)}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:26px}
.profile-name{font-size:18px;font-weight:800}
.profile-username{color:var(--muted);font-size:13px;margin-top:2px;margin-bottom:16px}
.pi-row{font-size:14px;line-height:1.5;padding-top:12px;margin-top:12px;border-top:1px solid var(--border)}
.pi-row:first-child{border-top:none;padding-top:0;margin-top:0}
.pi-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.detail{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.detail-hero{height:240px;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;color:#fff;font-size:52px;font-weight:800}
.detail-body{padding:26px 28px 30px}
.detail-cat{font-size:11px;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.detail-title{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:16px}
.detail-author{display:flex;align-items:center;gap:12px;padding:12px 0 18px;border-bottom:1px solid var(--border);margin-bottom:18px}
.detail-author-info{flex:1}
.detail-author-name{font-weight:700;font-size:14px}
.detail-author-sub{color:var(--muted);font-size:12px}
.detail-swap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.detail-swap-block{padding:14px 16px;border-radius:var(--rs);background:var(--bg);border:1px solid var(--border)}
.detail-swap-block.want{background:rgba(124,58,237,.06);border-color:rgba(124,58,237,.2)}
.detail-swap-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.detail-swap-block.want .detail-swap-lbl{color:var(--violet)}
.detail-swap-txt{font-size:14px;font-weight:600;line-height:1.4}
.detail-desc{font-size:14px;line-height:1.65;margin-bottom:22px;white-space:pre-wrap}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap}
.exchange{padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
.ex-head{display:flex;justify-content:space-between;gap:14px;margin-bottom:10px;flex-wrap:wrap;align-items:flex-start}
.ex-title{font-size:14px;font-weight:700;margin-bottom:3px}
.ex-sub{color:var(--muted);font-size:12px}
.ex-status{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.st-pending{background:rgba(245,158,11,.15);color:#B45309}
.st-accepted{background:rgba(124,58,237,.12);color:var(--violet)}
.st-rejected{background:rgba(220,38,38,.1);color:var(--red)}
.st-completed{background:rgba(22,163,74,.12);color:var(--green)}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:480px}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.chat-head-info{flex:1;min-width:0}
.chat-head-title{font-weight:700;font-size:14px}
.chat-head-sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:72%;padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.45;word-wrap:break-word}
.msg-in{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:3px}
.msg-out{background:var(--violet);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg-time{font-size:10px;opacity:.7;margin-top:3px;display:block}
.chat-input{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input input{flex:1;padding:10px 13px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--card);color:var(--text);font-size:14px;outline:none}
.chat-input input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.chat-locked{padding:14px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:13px;background:var(--bg)}
.video-zone{padding:14px 18px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.video-zone-head{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.video-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.video-slot{padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);text-align:center;font-size:13px}
.video-slot.done{border-color:var(--green);background:rgba(22,163,74,.06)}
.video-slot.done .video-slot-status{color:var(--green);font-weight:700}
.video-slot.wait .video-slot-status{color:var(--muted)}
.video-slot-label{font-weight:700;margin-bottom:4px;font-size:12px}
.video-slot-status{font-size:12px}
.video-upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file-label{padding:9px 16px;border-radius:var(--rs);border:1px dashed var(--border2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.file-label:hover{border-color:var(--violet);color:var(--violet)}
.video-upload input[type=file]{display:none}
.notifications-list{display:flex;flex-direction:column;gap:10px}
.notif{padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);display:flex;gap:14px;align-items:flex-start}
.notif.unread{border-color:var(--violet);background:rgba(124,58,237,.04)}
.notif-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.notif-icon.exchange_request{background:rgba(249,115,22,.15)}
.notif-icon.exchange_accepted{background:rgba(22,163,74,.15)}
.notif-icon.exchange_rejected{background:rgba(220,38,38,.12)}
.notif-icon.exchange_completed{background:rgba(124,58,237,.15)}
.notif-body{flex:1;min-width:0}
.notif-text{font-size:14px;line-height:1.45;margin-bottom:6px}
.notif-meta{font-size:12px;color:var(--muted)}
.notif-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:14px;font-weight:600;box-shadow:var(--shL);z-index:999;opacity:0;transition:.3s cubic-bezier(.16,1,.3,1);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal.show{display:flex}
.modal-card{background:var(--card);border-radius:var(--r);padding:26px;max-width:460px;width:100%;box-shadow:var(--shL)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.footer{padding:22px 0;border-top:1px solid var(--border);color:var(--muted);font-size:12px;background:var(--card);margin-top:auto}
.footer-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.loading{padding:48px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.steps{grid-template-columns:repeat(2,1fr)}.nav{display:none}}
@media(max-width:640px){.container{padding:0 16px}.topbar-in{height:56px;gap:10px}.logo-text{display:none}.main{padding:22px 0 40px}.hero{padding:32px 18px;margin-bottom:24px}.steps{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.form-card{padding:22px 18px}.field-row{grid-template-columns:1fr}.detail-body{padding:20px 18px 24px}.detail-hero{height:180px}.detail-swap{grid-template-columns:1fr}.chat{height:calc(100vh - 140px);min-height:420px}.video-slots{grid-template-columns:1fr}.actions .btn span.btn-label{display:none}.actions .btn{padding:9px 11px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="container topbar-in">
    <a href="#/" class="logo"><span class="logo-mark">⇄</span><span class="logo-text">Обмен навыками</span></a>
    <nav class="nav">
      <a href="#/">Главная</a>
      <a href="#/listings">Объявления</a>
      <a href="#/exchanges">Обмены</a>
      <a href="#/chats">Чаты</a>
    </nav>
    <div class="actions" id="headerActions"></div>
  </div>
</header>
<main class="container main" id="app"></main>
<footer class="footer">
  <div class="container footer-in">
    <div>© 2026 Обмен навыками</div>
    <div>Сделано для обмена знаниями</div>
  </div>
</footer>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<script type="module">
import * as DB from './db.js';

const $=s=>document.querySelector(s);
const app=$('#app');
const CATS=['Музыка','Программирование','Языки','Спорт','Дизайн','Кулинария','Учёба','Другое'];
const SESSION_KEY='obmen_uid';
const THEME_KEY='obmen_theme';

const state={user:null,listings:[],exchanges:[],notifs:[],unsubs:{}};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(t){return new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function fmtDate(t){return new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function plural(n,f){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return n+' '+f[2];if(b>1&&b<5)return n+' '+f[1];if(b===1)return n+' '+f[0];return n+' '+f[2]}

let toastTimer;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function openModal(h){$('#modalCard').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function setTheme(t){document.body.setAttribute('data-theme',t);localStorage.setItem(THEME_KEY,t);renderHeader()}

function findUser(id){return state.allUsers?state.allUsers.find(u=>u.id===id):null}

async function loadAllUsers(){state.allUsers=await DB.getAllUsers()}

function renderHeader(){
  const el=$('#headerActions');
  const dark=document.body.getAttribute('data-theme')==='dark';
  let h=`<button class="theme-btn" onclick="window.__setTheme('${dark?'light':'dark'}')">${dark?'☀':'☾'}</button>`;
  if(state.user){
    const initial=(state.user.firstName||state.user.username)[0].toUpperCase();
    const unread=state.notifs.filter(n=>!n.read).length;
    const badge=unread>0?`<span class="bell-badge">${unread>9?'9+':unread}</span>`:'';
    h+=`<button class="bell" onclick="location.hash='#/notifications'">🔔${badge}</button>
      <a href="#/create" class="btn btn-outline"><span>+</span><span class="btn-label">Разместить</span></a>
      <a href="#/cabinet" class="btn btn-ghost"><span class="avatar">${esc(initial)}</span></a>
      <button class="btn btn-ghost" onclick="window.__logout()">Выйти</button>`;
  }else{
    h+=`<a href="#/login" class="btn btn-ghost">Войти</a><a href="#/register" class="btn btn-primary">Регистрация</a>`;
  }
  el.innerHTML=h;
}

function emptyBlock(icon,title,text,link,btn){
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${esc(title)}</div><div class="empty-text">${esc(text)}</div>${link?`<a href="${link}" class="btn btn-primary">${esc(btn)}</a>`:''}</div>`;
}

function cardHTML(l){
  const u=findUser(l.authorId);
  if(!u)return '';
  const initial=(u.firstName||u.username)[0].toUpperCase();
  return `<article class="card" onclick="location.hash='#/listing/${l.id}'">
    <div class="card-img">${esc(l.title[0].toUpperCase())}</div>
    <div class="card-body">
      <div class="card-cat">${esc(l.category)}</div>
      <div class="card-title">${esc(l.title)}</div>
      <div class="card-swap">
        <div class="swap-row"><span class="swap-lbl give">Даю:</span><span class="swap-text">${esc(l.offer)}</span></div>
        <div class="swap-row"><span class="swap-lbl want">Хочу:</span><span class="swap-text">${esc(l.want)}</span></div>
      </div>
      <div class="card-footer"><span class="avatar">${esc(initial)}</span><span>${esc(u.firstName+' '+u.lastName)}</span></div>
    </div></article>`;
}

  const cnt=$('#listingsCount');
  if(cnt)cnt.textContent=items.length?plural(items.length,['предложение','предложения','предложений']):'Пока нет предложений';

function openExchange(lid){
  if(!state.user){toast('Войдите, чтобы отправить запрос');location.hash='#/login';return}
  openModal(`<div class="modal-title">Запрос на обмен</div>
    <div class="modal-sub">Автор получит уведомление и сможет принять или отклонить запрос.</div>
    <div class="field"><label>Сообщение <span class="hint">— по желанию</span></label>
      <textarea id="exchangeMsg" rows="3" placeholder="Расскажите, почему вам интересен обмен"></textarea></div>
    <div class="form-error" id="exchangeErr"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="window.__closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="window.__sendExchange('${lid}')">Отправить</button>
    </div>`);
}

async function sendExchange(lid){
  const err=$('#exchangeErr');
  const msg=$('#exchangeMsg').value.trim();
  try{
    const l=state.listings.find(x=>x.id===lid);
    if(!l)throw new Error('Объявление не найдено');
    const existing=await DB.checkExistingExchange(lid,state.user.id);
    if(existing){err.textContent='Запрос уже отправлен';err.classList.add('show');return}
    await DB.createExchange(lid,state.user.id,l.authorId,msg);
    closeModal();toast('Запрос отправлен');location.hash='#/exchanges';
  }catch(e){err.textContent=e.message;err.classList.add('show')}
}

async function doRegister(e){
  e.preventDefault();
  const err=$('#regError');
  const fn=$('#regFirstName').value.trim();
  const ln=$('#regLastName').value.trim();
  const un=$('#regUsername').value.trim();
  const em=$('#regEmail').value.trim();
  const pw=$('#regPassword').value;
  const ct=$('#regCanTeach').value.trim();
  const wl=$('#regWantsLearn').value.trim();
  const bio=$('#regBio').value.trim();
  if(!/^[a-z0-9_]{3,20}$/i.test(un)){err.textContent='Логин: 3-20 символов, латиница, цифры, _';err.classList.add('show');return}
  if(!/^\S+@\S+\.\S+$/.test(em)){err.textContent='Некорректная почта';err.classList.add('show');return}
  if(pw.length<6){err.textContent='Пароль — минимум 6 символов';err.classList.add('show');return}
  if(!fn||!ln){err.textContent='Укажите имя и фамилию';err.classList.add('show');return}
  if(!ct||!wl){err.textContent='Заполните навыки';err.classList.add('show');return}
  try{
    const user=await DB.registerUser({username:un,email:em,password:pw,firstName:fn,lastName:ln,canTeach:ct,wantsLearn:wl,bio});
    localStorage.setItem(SESSION_KEY,user.id);
    state.user=user;
    renderHeader();
    toast('Регистрация завершена');
    location.hash='#/cabinet';
  }catch(ex){err.textContent=ex.message;err.classList.add('show')}
}

  </div>`;

function exCard(ex){
  const isOwner=state.user.id===ex.ownerId;
  const other=findUser(isOwner?ex.initiatorId:ex.ownerId);
  const otherName=other?(other.firstName+' '+other.lastName):'—';
  const l=state.listings.find(x=>x.id===ex.listingId);
  const stMap={pending:'Ожидает',accepted:'Активен',rejected:'Отклонён',completed:'Завершён'};
  const roleLabel=isOwner?'Входящий':'Исходящий';
  let actions='';
  if(ex.status==='pending'&&isOwner){
    actions=`<div class="ex-actions">
      <button class="btn btn-primary" onclick="window.__acceptEx('${ex.id}')">Принять</button>
      <button class="btn btn-outline" onclick="window.__rejectEx('${ex.id}')">Отклонить</button></div>`;
  }else if(ex.status==='pending'&&!isOwner){
    actions='<div class="ex-actions"><span style="color:var(--muted);font-size:13px">Ожидает ответа автора</span></div>';
  }else if(ex.status==='accepted'){
    actions=`<div class="ex-actions"><a href="#/chat/${ex.id}" class="btn btn-primary">Открыть чат</a></div>`;
  }else if(ex.status==='completed'){
    actions=`<div class="ex-actions"><a href="#/chat/${ex.id}" class="btn btn-ghost">История чата</a></div>`;
  }
  return `<div class="exchange">
    <div class="ex-head">
      <div style="flex:1;min-width:200px">
        <div class="ex-title">${esc(l?l.title:'Объявление удалено')}</div>
        <div class="ex-sub">${roleLabel} · ${esc(otherName)} · ${fmtDate(ex.createdAt)}</div>
      </div>
      <span class="ex-status st-${ex.status}">${stMap[ex.status]}</span>
    </div>${actions}</div>`;
}

function notifCard(n,iconMap){
  const ex=n.exchangeId?state.exchanges.find(e=>e.id===n.exchangeId):null;
  const isOwner=ex&&state.user&&state.user.id===ex.ownerId;
  let actions='';
  if(n.type==='exchange_request'&&ex&&ex.status==='pending'&&isOwner){
    actions=`<div class="notif-actions">
      <button class="btn btn-primary btn-sm" onclick="window.__acceptEx('${ex.id}')">Принять</button>
      <button class="btn btn-outline btn-sm" onclick="window.__rejectEx('${ex.id}')">Отклонить</button>
    </div>`;
  }else if((n.type==='exchange_accepted'||n.type==='exchange_completed')&&ex){
    actions=`<div class="notif-actions"><a href="#/chat/${ex.id}" class="btn btn-outline btn-sm">Открыть чат</a></div>`;
  }
  return `<div class="notif ${n.read?'':'unread'}">
    <div class="notif-icon ${n.type}">${iconMap[n.type]||'•'}</div>
    <div class="notif-body">
      <div class="notif-text">${esc(n.text)}</div>
      <div class="notif-meta">${fmtDate(n.createdAt)}</div>
      ${actions}
    </div>
  </div>`;
}

function screenChats(){
  if(!state.user)return location.hash='#/login';
  const chats=state.exchanges.filter(x=>x.status==='accepted'||x.status==='completed');
  if(!chats.length){
    app.innerHTML=`<div class="view active">
      <div class="section-head"><div class="section-title">Чаты</div><div class="section-sub">Общение с партнёрами</div></div>
      ${emptyBlock('💬','Чатов пока нет','Чат откроется после того, как автор объявления примет ваш запрос.','#/listings','К объявлениям')}
    </div>`;return;
  }
  app.innerHTML=`<div class="view active">
    <div class="section-head"><div class="section-title">Чаты</div><div class="section-sub">${plural(chats.length,['активный чат','активных чата','активных чатов'])}</div></div>
    <div>${chats.map(chatListItem).join('')}</div>
  </div>`;
}
function chatListItem(ex){
  const isOwner=state.user.id===ex.ownerId;
  const other=findUser(isOwner?ex.initiatorId:ex.ownerId);
  const name=other?(other.firstName+' '+other.lastName):'Пользователь';
  const initial=name[0].toUpperCase();
  const l=state.listings.find(x=>x.id===ex.listingId);
  return `<a href="#/chat/${ex.id}" class="exchange" style="display:block">
    <div class="ex-head">
      <div style="display:flex;gap:12px;align-items:center;flex:1;min-width:200px">
        <span class="avatar-md">${esc(initial)}</span>
        <div style="min-width:0">
          <div class="ex-title">${esc(name)}</div>
          <div class="ex-sub">${esc(l?l.title:'Объявление')}</div>
        </div>
      </div>
      <span class="ex-status st-${ex.status}">${ex.status==='accepted'?'Активен':'Завершён'}</span>
    </div></a>`;
}

async function screenChat(id){
  if(!state.user)return location.hash='#/login';
  const ex=state.exchanges.find(e=>e.id===id);
  if(!ex){app.innerHTML=`<div class="view active">${emptyBlock('×','Обмен не найден','Возможно, удалён.','#/chats','К чатам')}</div>`;return}
  if(ex.initiatorId!==state.user.id&&ex.ownerId!==state.user.id){app.innerHTML=`<div class="view active">${emptyBlock('×','Нет доступа','Вы не участник.','#/chats','К чатам')}</div>`;return}

  const otherId=ex.initiatorId===state.user.id?ex.ownerId:ex.initiatorId;
  const other=findUser(otherId);
  const otherName=other?(other.firstName+' '+(other.lastName||'')):'Пользователь';
  const otherInitial=otherName[0].toUpperCase();
  const l=state.listings.find(x=>x.id===ex.listingId);
  const listTitle=l?l.title:'Обмен';
  const locked=ex.status!=='accepted'&&ex.status!=='completed';
  const isCompleted=ex.status==='completed';
  const myUploaded=ex.initiatorId===state.user.id?!!ex.initiatorVideo:!!ex.ownerVideo;
  const otherUploaded=ex.initiatorId===state.user.id?!!ex.ownerVideo:!!ex.initiatorVideo;

  app.innerHTML=`<div class="view active">
    <a href="#/chats" class="btn btn-ghost btn-sm" style="margin-bottom:12px">← К чатам</a>
    <div class="chat">
      <div class="chat-head">
        <span class="avatar-md">${esc(otherInitial)}</span>
        <div class="chat-head-info">
          <div class="chat-head-title">${esc(otherName)}</div>
          <div class="chat-head-sub">${esc(listTitle)}</div>
        </div>
      </div>
      <div class="chat-body" id="chatBody"><div class="loading">Загрузка…</div></div>
      ${locked?'<div class="chat-locked">Чат откроется после принятия запроса</div>'
        :`<form class="chat-input" onsubmit="window.__sendMsg(event,'${ex.id}')">
            <input type="text" id="chatInput" placeholder="Написать сообщение…" autocomplete="off" maxlength="1000">
            <button type="submit" class="btn btn-primary">Отправить</button>
          </form>`}
      ${!locked?`<div class="video-zone">
        <div class="video-zone-head">Видеоуроки для завершения обмена</div>
        <div class="video-slots">
          <div class="video-slot ${myUploaded?'done':'wait'}">
            <div class="video-slot-label">Ваш урок</div>
            <div class="video-slot-status">${myUploaded?'Загружен ✓':'Не загружен'}</div>
          </div>
          <div class="video-slot ${otherUploaded?'done':'wait'}">
            <div class="video-slot-label">Урок партнёра</div>
            <div class="video-slot-status">${otherUploaded?'Загружен ✓':'Ожидается'}</div>
          </div>
        </div>
        ${isCompleted?'<div style="text-align:center;color:var(--green);font-weight:700;font-size:13px">Обмен завершён. Начислен Тайм-коин.</div>'
          :(myUploaded?'<div style="text-align:center;color:var(--muted);font-size:13px">Ожидаем видео от партнёра</div>'
            :`<div class="video-upload">
                <label class="file-label" for="videoFile">📹 Прикрепить видеоурок (до 500 КБ)</label>
                <input type="file" id="videoFile" accept="video/*" onchange="window.__uploadVideo('${ex.id}',this)">
                <span id="videoFileName" style="font-size:13px;color:var(--muted)"></span>
              </div>`)}
      </div>`:''}
    </div>
  </div>`;

  // отписка от прошлых чатов
  if(state.unsubs.messages){state.unsubs.messages();state.unsubs.messages=null}
  state.unsubs.messages=DB.watchMessages(ex.id,msgs=>{
    const body=$('#chatBody');
    if(!body)return;
    const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<80;
    body.innerHTML=msgs.length
      ?msgs.map(m=>{const mine=m.senderId===state.user.id;
        return `<div class="msg ${mine?'msg-out':'msg-in'}">${esc(m.text)}<span class="msg-time">${fmtTime(m.createdAt)}</span></div>`}).join('')
      :'<div style="text-align:center;color:var(--muted);font-size:13px;padding:16px">Сообщений пока нет</div>';
    if(atBottom)body.scrollTop=body.scrollHeight;
  });

  setTimeout(()=>{const b=$('#chatBody');if(b)b.scrollTop=b.scrollHeight},150);
}

async function sendMsg(e,id){
  e.preventDefault();
  const input=$('#chatInput');
  const text=input.value.trim();
  if(!text)return;
  try{
    await DB.sendMessage(id,state.user.id,text);
    input.value='';
  }catch(ex){toast(ex.message)}
}

async function uploadVideo(id,input){
  const file=input.files[0];
  if(!file)return;
  const nameEl=$('#videoFileName');
  if(nameEl)nameEl.textContent=file.name+' (загрузка…)';
  try{
    const r=await DB.uploadVideo(id,state.user.id,file);
    if(r.completed)toast('Обмен завершён! Начислен Тайм-коин');
    else toast('Видеоурок загружен. Ожидаем партнёра.');
    const fresh=await DB.getUser(state.user.id);
    if(fresh)state.user=fresh;
  }catch(e){toast(e.message)}
}

function screenUser(username){
  const u=(state.allUsers||[]).find(x=>x.username===username);
  if(!u){app.innerHTML=`<div class="view active">${emptyBlock('×','Пользователь не найден','Такого аккаунта нет.','#/listings','К объявлениям')}</div>`;return}
  const items=state.listings.filter(l=>l.authorId===u.id);
  const initial=(u.firstName||u.username)[0].toUpperCase();
  app.innerHTML=`<div class="view active">
    <div class="profile-card" style="max-width:640px;margin:0 auto 20px">
      <div class="avatar-lg">${esc(initial)}</div>
      <div class="profile-name">${esc(u.firstName+' '+u.lastName)}</div>
      <div class="profile-username">@${esc(u.username)}</div>
      <div class="pi-row"><div class="pi-label">Могу научить</div><div>${esc(u.canTeach||'—')}</div></div>
      <div class="pi-row"><div class="pi-label">Хочу научиться</div><div>${esc(u.wantsLearn||'—')}</div></div>
      <div class="pi-row"><div class="pi-label">О себе</div><div>${esc(u.bio||'—')}</div></div>
    </div>
    <div class="section-head"><div class="section-title">Объявления</div><div class="section-sub">${items.length?'Активные предложения':'Нет активных предложений'}</div></div>
    ${items.length?'<div class="grid">'+items.map(cardHTML).join('')+'</div>':''}
  </div>`;
}

async function route(){
  if(state.unsubs.messages){state.unsubs.messages();state.unsubs.messages=null}
  const hash=location.hash.replace(/^#/,'')||'/';
  const parts=hash.split('/').filter(Boolean);
  if(!parts.length)return screenHome();
  if(parts[0]==='listings')return screenListings();
  if(parts[0]==='listing'&&parts[1])return screenListing(parts[1]);
  if(parts[0]==='login')return screenLogin();
  if(parts[0]==='register')return screenRegister();
  if(parts[0]==='cabinet')return screenCabinet();
  if(parts[0]==='create')return screenCreate();
  if(parts[0]==='exchanges')return screenExchanges();
  if(parts[0]==='chats')return screenChats();
  if(parts[0]==='chat'&&parts[1])return screenChat(parts[1]);
  if(parts[0]==='notifications')return screenNotifications();
  if(parts[0]==='user'&&parts[1])return screenUser(parts[1]);
  return screenHome();
}

/* глобальные функции для onclick в HTML */
window.__setTheme=setTheme;
window.__closeModal=closeModal;
window.__logout=()=>{localStorage.removeItem(SESSION_KEY);state.user=null;renderHeader();toast('Вы вышли');location.hash='#/'};
window.__filterCat=(cat,el)=>{state.filterCat=cat;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');loadListings()};
window.__openExchange=openExchange;
window.__sendExchange=sendExchange;
window.__doLogin=doLogin;
window.__doRegister=doRegister;
window.__switchTab=(id,el)=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.querySelectorAll('[id^="tab-"]').forEach(t=>t.style.display='none');document.getElementById('tab-'+id).style.display='block'};
window.__doCreate=doCreate;
window.__acceptEx=acceptEx;
window.__rejectEx=rejectEx;
window.__sendMsg=sendMsg;
window.__uploadVideo=uploadVideo;

/* инициализация */
window.addEventListener('hashchange',()=>{route()});
window.addEventListener('DOMContentLoaded',async()=>{
  const savedTheme=localStorage.getItem(THEME_KEY)||'light';
  document.body.setAttribute('data-theme',savedTheme);

  // подгрузка всех пользователей
  try{await loadAllUsers()}catch(e){}

  // сессия
  const uid=localStorage.getItem(SESSION_KEY);
  if(uid){
    try{
      const u=await DB.getUser(uid);
      if(u)state.user=u;else localStorage.removeItem(SESSION_KEY);
    }catch(e){}
  }
  renderHeader();

  // подписка на объявления
  DB.watchListings(list=>{
    state.listings=list;
    route();
  });

  // если вошли — подписки на обмены и уведомления
  if(state.user){
    DB.watchExchanges(state.user.id,list=>{state.exchanges=list;route()});
    DB.watchNotifications(state.user.id,list=>{state.notifs=list;renderHeader()});
    DB.watchUser(state.user.id,u=>{
      if(u){state.user=u;renderHeader();}
    });
    // обновление списка юзеров раз в минуту
    setInterval(()=>loadAllUsers().catch(()=>{}),60000);
  }

  route();
});
</script>
</body>
</html>
